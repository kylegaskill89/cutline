name: Release

# Tag a commit `vX.Y.Z` (matching the version in tauri.conf.json) and push the
# tag to build a signed Windows installer, publish a GitHub Release, and upload
# the `latest.json` manifest the in-app updater reads.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # create the release + upload assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Fetch bundled ffmpeg/ffprobe sidecars
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $triple = "x86_64-pc-windows-msvc"
          $dest = "src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = "$env:RUNNER_TEMP/ffmpeg.zip"
          Write-Host "Downloading ffmpeg (release essentials build)..."
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip
          $out = "$env:RUNNER_TEMP/ffmpeg"
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $ff = Get-ChildItem -Path $out -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $fp = Get-ChildItem -Path $out -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ff.FullName "$dest/ffmpeg-$triple.exe" -Force
          Copy-Item $fp.FullName "$dest/ffprobe-$triple.exe" -Force
          Write-Host "Sidecars in place:"
          Get-ChildItem $dest

      - name: Build, sign, and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cutline ${{ github.ref_name }}"
          releaseBody: "Automated release. The installer auto-updates existing installs."
          releaseDraft: false
          prerelease: false
          # Emits latest.json (the updater manifest) alongside the installer.
          includeUpdaterJson: true
